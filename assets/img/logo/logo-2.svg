<svg width="136" height="28" viewBox="0 0 136 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Leadkeep comet logo</title>
  <defs>
    <linearGradient id="tailMain" x1="3" y1="23" x2="23" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD38A" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#D7F1FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="tailSoft" x1="4" y1="25" x2="22" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD38A" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#D7F1FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-10" y="-8" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- icon container -->
  <rect x="0.75" y="2.75" width="22.5" height="22.5" rx="6.5" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- flame tail: wider and more cartoon-like, directed upward -->
  <g filter="url(#softGlow)">
    <path d="M4.9 20.8 C8.8 15.6 13.2 11.4 20.3 8.2 C15.5 12.4 11.2 17.4 8.7 23.1 C7.3 22.8 6.1 22.1 4.9 20.8Z" fill="url(#tailSoft)"/>
    <path d="M3.9 17.8 C8.8 13.1 14.3 9.9 21.7 7.3 C15.6 10.5 10.3 14.6 5.9 20.5 C5.1 19.8 4.4 18.9 3.9 17.8Z" fill="url(#tailMain)"/>
    <path d="M6.5 14.9 C10.6 12.2 15.7 9.9 21.6 8.1 C16.3 9.9 12.2 12.4 8.5 16.9 C7.6 16.5 7.0 15.8 6.5 14.9Z" fill="#D7F1FF" opacity="0.9"/>
  </g>

  <!-- comet head, not sperm-like: compact glowing fireball -->
  <circle cx="20.3" cy="7.7" r="4.15" fill="#FFFFFF"/>
  <circle cx="19.1" cy="6.45" r="1.05" fill="#D7F1FF" opacity="0.9"/>
  <path d="M20.3 3.65 C22.55 3.65 24.35 5.45 24.35 7.7 C24.35 9.95 22.55 11.75 20.3 11.75" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>

  <!-- wordmark -->
  <text x="31" y="20.2"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="-0.85"
        fill="#FFFFFF">Leadkeep</text>
</svg>